name: Audio compatibility
on: workflow_dispatch
jobs:
  audio:
    runs-on: [self-hosted, linux, osky-audio]
    steps:
      - uses: actions/checkout@v4
      - run: uv sync --frozen
      - run: ./scripts/check_compatibility.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-reports
          path: workspace/reports/
